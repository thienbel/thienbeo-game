<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THIENBEO</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #08090b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Keyframes chuyển động dải màu RGB 7 màu Neon */
        @keyframes rainbowMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* 1. Viền khung ngoài cùng RGB Neon */
        .card-wrapper {
            padding: 3px;
            border-radius: 20px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rainbowMove 3s linear infinite;
            box-shadow: 0 0 30px rgba(0, 255, 213, 0.4);
        }

        .card {
            background: #11141a;
            border-radius: 17px;
            padding: 30px;
            width: 390px;
            text-align: center;
        }

        /* Tiêu đề 7 màu Neon */
        .title-neon {
            font-size: 22px;
            font-weight: 900;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowMove 2.5s linear infinite;
        }

        /* 2. Khung Số Dư có viền RGB Neon */
        .balance-wrapper {
            padding: 2px;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rainbowMove 3s linear infinite;
            margin-bottom: 20px;
        }

        .balance-box {
            background: #0a0c0f;
            border-radius: 8px;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .balance-amount {
            color: #ffcc00;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        /* 3. Các ô Gacha Slot có viền RGB Neon */
        .gacha-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .slot-wrapper {
            padding: 2px;
            border-radius: 14px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rainbowMove 3s linear infinite;
        }

        .slot {
            width: 95px;
            height: 95px;
            background: #1a1e27;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            transition: transform 0.1s;
        }

        .slot.spin {
            animation: bounce 0.15s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(-5px); }
            to { transform: translateY(5px); }
        }

        /* 4. Khung viền RGB bao quanh các nút bấm */
        .btn-wrapper {
            padding: 2px;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rainbowMove 3s linear infinite;
            margin-bottom: 12px;
        }

        .btn-spin {
            width: 100%;
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-spin:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        .btn-spin:disabled {
            background: #383f47;
            color: #8b949e;
            cursor: not-allowed;
            transform: none;
        }

        .btn-recharge {
            width: 100%;
            background: linear-gradient(135deg, #ff9900, #ff0055);
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-recharge-container {
            display: none;
        }

        .message {
            margin-top: 15px;
            font-size: 16px;
            min-height: 28px;
            font-weight: bold;
        }

        .lose { color: #ff4d4d; }

        /* Chữ Nổ Hũ 7 Màu Neon */
        .rgb-text {
            font-weight: 900;
            font-size: 18px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowMove 1.5s linear infinite;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="card-wrapper">
    <div class="card">
        <div class="title-neon">🎰 THIENBEO  🎰</div>
        
        <div class="balance-wrapper">
            <div class="balance-box">
                Số dư: <span id="balance" class="balance-amount">50.000</span> VNĐ
            </div>
        </div>

        <div class="gacha-container">
            <div class="slot-wrapper"><div class="slot" id="slot1">❓</div></div>
            <div class="slot-wrapper"><div class="slot" id="slot2">❓</div></div>
            <div class="slot-wrapper"><div class="slot" id="slot3">❓</div></div>
        </div>

        <div class="btn-wrapper" id="spinWrapper">
            <button id="spinBtn" class="btn-spin" onclick="spinGacha()">QUAY (10.000 VNĐ)</button>
        </div>

        <div class="btn-wrapper btn-recharge-container" id="rechargeWrapper">
            <button id="rechargeBtn" class="btn-recharge" onclick="rechargeMoney()">💳 NẠP LẠI 50.000 VNĐ</button>
        </div>

        <div class="message" id="statusMsg">Bấm nút QUAY để thử vận may!</div>
    </div>
</div>

<script>
    const items = ['💎', '🚀', '🔥', '👑', '⚡'];
    const SPIN_COST = 10000;
    const REWARD = 36000;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'spin') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'win') {
            const freqs = [523.25, 659.25, 783.99, 1046.50];
            freqs.forEach((freq, idx) => {
                const subOsc = audioCtx.createOscillator();
                const subGain = audioCtx.createGain();
                subOsc.type = 'sine';
                subOsc.frequency.value = freq;
                subOsc.connect(subGain);
                subGain.connect(audioCtx.destination);
                
                const startTime = now + idx * 0.12;
                subGain.gain.setValueAtTime(0.2, startTime);
                subGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                subOsc.start(startTime);
                subOsc.stop(startTime + 0.3);
            });
        } else if (type === 'lose') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'recharge') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.setValueAtTime(880, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    let balance = parseInt(localStorage.getItem('thienbeo_gacha_balance'));
    if (isNaN(balance)) {
        balance = 50000;
    }

    function updateDisplay() {
        document.getElementById('balance').innerText = balance.toLocaleString('vi-VN');
        localStorage.setItem('thienbeo_gacha_balance', balance);

        const rechargeWrapper = document.getElementById('rechargeWrapper');
        const spinWrapper = document.getElementById('spinWrapper');

        if (balance < SPIN_COST) {
            rechargeWrapper.style.display = "block";
            spinWrapper.style.display = "none";
        } else {
            rechargeWrapper.style.display = "none";
            spinWrapper.style.display = "block";
        }
    }

    updateDisplay();

    function rechargeMoney() {
        balance = 200000;
        updateDisplay();
        playSound('recharge');
        const msg = document.getElementById('statusMsg');
        msg.innerText = "✅ Đã nạp thành công 200.000 VNĐ!";
        msg.className = "message";
    }

    function spinGacha() {
        if (balance < SPIN_COST) {
            document.getElementById('statusMsg').innerText = "❌ Bạn không đủ tiền để quay, Hãy nạp thêm!";
            document.getElementById('statusMsg').className = "message lose";
            playSound('lose');
            return;
        }

        balance -= SPIN_COST;
        updateDisplay();

        const btn = document.getElementById('spinBtn');
        const msg = document.getElementById('statusMsg');
        btn.disabled = true;
        msg.innerText = "🌀 Đang quay...";
        msg.className = "message";

        const slot1 = document.getElementById('slot1');
        const slot2 = document.getElementById('slot2');
        const slot3 = document.getElementById('slot3');

        slot1.classList.add('spin');
        slot2.classList.add('spin');
        slot3.classList.add('spin');

        const spinInterval = setInterval(() => {
            playSound('spin');
        }, 120);

        setTimeout(() => {
            clearInterval(spinInterval);

            const res1 = items[Math.floor(Math.random() * items.length)];
            const res2 = items[Math.floor(Math.random() * items.length)];
            const res3 = items[Math.floor(Math.random() * items.length)];

            slot1.innerText = res1;
            slot2.innerText = res2;
            slot3.innerText = res3;

            slot1.classList.remove('spin');
            slot2.classList.remove('spin');
            slot3.classList.remove('spin');

            if (res1 === res2 && res2 === res3) {
                balance += REWARD;
                updateDisplay();
                playSound('win');
                msg.innerHTML = `🎉 CHÚC MỪNG BẠN ĐÃ NỔ HŨ! (+${REWARD.toLocaleString('vi-VN')} VNĐ)`;
                msg.className = "message rgb-text";
            } else {
                playSound('lose');
                if (balance < SPIN_COST) {
                    msg.innerText = "❌ Hết tiền! Hãy bấm Nạp tiền bên dưới.";
                    msg.className = "message lose";
                } else {
                    msg.innerText = "😅 Chúc bạn may mắn lần sau!";
                    msg.className = "message lose";
                }
            }

            btn.disabled = false;
        }, 1000);
    }
</script>

</body>
</html>
